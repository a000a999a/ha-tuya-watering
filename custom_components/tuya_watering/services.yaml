refresh_dashboard:
  name: Refresh Dashboard
  description: >
    Re-scans all valves and any matching schedule automations/helpers, then
    creates or updates the "Tuya Watering" and "Tuya Watering Schedule" cards
    on the Overview dashboard. Runs automatically on setup/reload — this is
    for forcing an immediate refresh (e.g. right after importing a blueprint
    automation) without waiting for the next reload.

open_valve:
  name: Open Valve
  description: Open a watering valve for a specified duration. Uses the valve's configured default duration if not specified.
  target:
    entity:
      domain: switch
      integration: tuya_watering
  fields:
    duration:
      name: Duration
      description: How long to run the valve (seconds). Overrides the valve's default duration.
      required: false
      example: 120
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: s

close_valve:
  name: Close Valve
  description: Close a watering valve immediately.
  target:
    entity:
      domain: switch
      integration: tuya_watering

notify_skip:
  name: Notify Skip
  description: Send a skip-notification email when watering is skipped due to rain forecast. Called automatically by watering automations.
  fields:
    valve:
      name: Valve
      description: Valve name (e.g. "Terrasse")
      required: true
      example: "Terrasse"
      selector:
        text:
    run:
      name: Run
      description: Which run was skipped (e.g. "Run 1")
      required: true
      example: "Run 1"
      selector:
        text:
    time:
      name: Scheduled time
      description: The time the run was scheduled for
      required: false
      example: "00:15"
      selector:
        text:
    today_condition:
      name: Today's condition
      description: Weather condition string from the forecast
      required: false
      example: "cloudy"
      selector:
        text:
    today_rain_pct:
      name: Today's rain probability (%)
      required: false
      example: 60
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    tomorrow_rain_pct:
      name: Tomorrow's rain probability (%)
      required: false
      example: 45
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
