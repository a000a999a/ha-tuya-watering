blueprint:
  name: Weather-Based Watering
  description: >
    Opens a valve at a scheduled time, then closes it after the configured
    duration. Skips automatically if any of the next 6 hourly forecast slots
    has rain probability at or above the threshold, or a stormy condition.
    Forecast is read fresh at trigger time. On skip, sends an email via
    tuya_watering.notify_skip (requires a Notify Entity configured on this
    valve's tuya_watering config entry) and logs to the logbook.
    Requires the Tuya Watering integration and any HA weather entity that
    supports hourly forecasts.
  domain: automation
  source_url: https://github.com/a000a999a/ha-tuya-watering/blob/main/blueprints/automation/tuya_watering/weather_based_watering.yaml

  input:
    weather_entity:
      name: Weather Entity
      description: Any HA weather entity that supports hourly forecasts (MeteoSwiss, OpenWeatherMap, AccuWeather, etc.)
      selector:
        entity:
          domain: weather

    valve_entity:
      name: Valve
      description: The valve from the Tuya Watering integration to control.
      selector:
        entity:
          domain: switch
          integration: tuya_watering

    valve_name:
      name: Valve Name
      description: Display name used in the skip-notification email (e.g. "Terrasse").
      selector:
        text: {}

    run_label:
      name: Run Label
      description: Identifies this run in the skip-notification email when a valve has multiple scheduled runs (e.g. "Run 1").
      default: "Run 1"
      selector:
        text: {}

    run_time:
      name: Start Time
      description: Time of day to start watering.
      selector:
        time: {}

    duration_minutes:
      name: Duration (minutes)
      description: How long to water.
      default: 2
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min

    rain_probability_threshold:
      name: Rain Probability Threshold (%)
      description: Skip watering if any of the next 6 hourly forecast slots has rain probability at or above this value.
      default: 40
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

    storm_conditions:
      name: Storm Conditions to Skip
      description: Watering is skipped if any of the next 6 hourly forecast slots matches any of these conditions.
      default:
        - rainy
        - pouring
        - lightning-rainy
        - lightning
        - hail
        - snowy-rainy
      selector:
        select:
          multiple: true
          options:
            - rainy
            - pouring
            - lightning-rainy
            - lightning
            - hail
            - snowy-rainy
            - snowy
            - windy-variant

trigger:
  - platform: time
    at: !input run_time

variables:
  weather_entity:              !input weather_entity
  valve_name:                  !input valve_name
  run_label:                   !input run_label
  rain_probability_threshold:  !input rain_probability_threshold
  storm_conditions:            !input storm_conditions
  duration_minutes:            !input duration_minutes

action:
  - action: weather.get_forecasts
    data:
      type: hourly
    target:
      entity_id: !input weather_entity
    response_variable: forecast_response

  - if:
      - condition: template
        value_template: >
          {% set fc = forecast_response[weather_entity]['forecast'] %}
          {% if not fc or fc | length == 0 %}
            false
          {% else %}
            {% set slots = fc[:6] %}
            {% set max_prob = slots | map(attribute='precipitation_probability') | map('default', 0) | map('int', 0) | max %}
            {% set any_rainy = slots | selectattr('condition', 'in', storm_conditions) | list | length > 0 %}
            {{ not any_rainy and max_prob < rain_probability_threshold }}
          {% endif %}

    then:
      - action: tuya_watering.open_valve
        data:
          duration: "{{ (duration_minutes | float * 60) | int }}"
        target:
          entity_id: !input valve_entity

      - delay:
          minutes: !input duration_minutes

      - action: tuya_watering.close_valve
        target:
          entity_id: !input valve_entity

    else:
      - action: tuya_watering.notify_skip
        data:
          valve: "{{ valve_name }}"
          run: "{{ run_label }}"
          time: "{{ now().strftime('%H:%M') }}"
          today_condition: >-
            {% set fc = forecast_response[weather_entity]['forecast'] %}
            {{ fc[0].get('condition', '') if fc and fc | length > 0 else '' }}
          today_rain_pct: >-
            {% set fc = forecast_response[weather_entity]['forecast'] %}
            {% set slots = fc[:6] if fc else [] %}
            {{ (slots | map(attribute='precipitation_probability') | map('default', 0) | map('int', 0) | max) if slots else 0 }}
          tomorrow_rain_pct: 0

      - action: logbook.log
        data:
          name: "Watering {{ valve_name }} - {{ run_label }}"
          message: Watering skipped - rain probability too high or stormy conditions in next 6h.
